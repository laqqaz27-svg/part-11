name: Periodic health check

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

jobs:
  health_check:
    runs-on: ubuntu-latest
    steps:
      - name: Check deployed Pokedex
        uses: jtalk/url-health-check-action@v5
        with:
          url: https://fs-pokedex-hidden-willow-4064.fly.dev/
          max-attempts: 3
          retry-delay: 5s
